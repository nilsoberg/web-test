<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFI-EST Plotly Fixes - Job 788</title>
    <script src="./plotly.min.js"></script>
    <style>
        :root {
            --canvas: #f3f1eb;
            --card: #ffffff;
            --ink: #202a2e;
            --muted: #647075;
            --line: #d8d5cc;
            --accent: #a53c32;
            --accent-soft: #f4e2de;
            --button: #315d66;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Avenir Next", "Gill Sans", sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at 10% 0%, rgba(165, 60, 50, 0.09), transparent 30rem), var(--canvas);
        }

        .page {
            width: min(1240px, calc(100% - 32px));
            margin: 0 auto;
            padding: 36px 0 56px;
        }

        .hero {
            margin-bottom: 20px;
            padding: 30px;
            color: #fff;
            background: #24383d;
            border-top: 5px solid var(--accent);
        }

        .hero h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: 500;
            line-height: 1;
        }

        .chart-grid { display: grid; gap: 22px; }

        .chart-card {
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--line);
            box-shadow: 0 12px 30px rgba(43, 54, 56, 0.06);
        }

        .chart-heading {
            display: flex;
            gap: 18px;
            justify-content: space-between;
            align-items: start;
            padding: 20px 22px 14px;
            border-bottom: 1px solid #ece9e2;
        }

        .chart-heading h2 { margin: 0 0 5px; font: 500 1.25rem Georgia, "Times New Roman", serif; }
        .chart-heading p { margin: 0; color: var(--muted); font-size: 0.86rem; line-height: 1.45; }
        .chart-number { flex: 0 0 auto; color: var(--accent); font: 1.4rem Georgia, "Times New Roman", serif; }
        .chart-target { width: 100%; height: 520px; }

        .chart-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            padding: 14px 20px 18px;
            border-top: 1px solid #ece9e2;
        }

        .download-button {
            appearance: none;
            padding: 9px 15px;
            border: 1px solid var(--button);
            border-radius: 3px;
            color: #fff;
            background: var(--button);
            font: 700 0.82rem "Avenir Next", "Gill Sans", sans-serif;
            cursor: pointer;
        }

        .download-button.secondary { color: var(--button); background: #fff; }
        .download-button:hover { filter: brightness(1.08); }
        .download-button:disabled { cursor: wait; opacity: 0.62; }

        @media (max-width: 720px) {
            .page { width: min(100% - 20px, 1240px); padding-top: 10px; }
            .hero { padding: 24px 20px; }
            .chart-target { height: 430px; }
            .chart-heading { padding-inline: 16px; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="hero">
            <div>
                <h1>EFI-EST Plotly fixes</h1>
            </div>
        </header>

        <section id="chart-grid" class="chart-grid" aria-label="Job 788 charts"></section>
    </main>

    <script src="./plot-data.js"></script>
    <script type="module" src="./plotly-demo.js"></script>
</body>
</html>
