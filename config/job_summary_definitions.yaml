            fields:
                - { property: 'numFastaHeaders', label: 'Number of FASTA Headers',                                      order: 84,                          condition_is_not_empty: }
                - { property: 'formattedUnirefVersion', label: 'UniRef Version',                                        order: 15,                          condition_all: [ { property: 'useUniref', is_true: true }, { property: 'useFamilies', is_true: true } ] }
                - { property: 'formattedUnirefVersionWithFamilies', label: 'Input Sequence Source',                     order: 16,                          condition_all: [ { property: 'useUniref', is_true: true }, { property: 'useFamilies', is_false: true } ] }
