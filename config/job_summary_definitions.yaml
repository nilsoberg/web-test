            'email_failed': 'generic_fallback_job_email_failed_summary'

    app.job_summary_definitions:
        _job_core_properties:
            - { property: 'id', label: 'Job Number',                                                                    order: 1 }
            - { property: 'jobName', label: 'Job Name',                                                                 order: 5,                                                           display_mode: 'download' }
            - { property: 'formattedType', label: 'Input Option',                                                       order: 6 }
            - { property: 'dbMetadata', label: 'Database Version',                                                      order: 7,   formatter: 'db_metadata',                   condition_is_not_empty: }

        _job_live_only_properties:
            - { property: 'formattedTimePeriod', label: 'Computation Duration',                                         order: 2 }
            #- { property: 'timeCreated', label: 'Time Created',                                                         order: 3,   formatter: 'datetime', skeleton: 'yMMMdjm', default: 'N/A' }
            - { property: 'timeStarted', label: 'Time Started',                                                         order: 3,   formatter: 'datetime', skeleton: 'yMMMdjm', default: 'N/A' }
            - { property: 'timeFinished', label: 'Time Finished',                                                       order: 4,   formatter: 'datetime', skeleton: 'yMMMdjm', condition_is_not_empty: }

        _email_job_submitted_properties:
            - { property: 'timeCreated', label: 'Time Created',                                                         order: 3,   formatter: 'datetime', skeleton: 'yMMMdjm', default: 'N/A' }
        _email_job_started_properties:
            - { property: 'timeStarted', label: 'Time Started',                                                         order: 3,   formatter: 'datetime', skeleton: 'yMMMdjm', default: 'N/A' }
            - { property: 'timeFinished', label: 'Time Finished',                                                       order: 4,   formatter: 'datetime', skeleton: 'yMMMdjm', condition_is_not_empty: }
        _email_job_finished_properties:
            - { property: 'formattedTimePeriod', label: 'Computation Duration',                                         order: 2 }
            - { property: 'timeStarted', label: 'Time Started',                                                         order: 3,   formatter: 'datetime', skeleton: 'yMMMdjm', default: 'N/A' }
            - { property: 'timeFinished', label: 'Time Finished',                                                       order: 4,   formatter: 'datetime', skeleton: 'yMMMdjm', condition_is_not_empty: }
        _email_job_failed_properties:
            - { property: 'timeStarted', label: 'Time Started',                                                         order: 3,   formatter: 'datetime', skeleton: 'yMMMdjm', default: 'N/A' }
            - { property: 'timeFinished', label: 'Time Finished',                                                       order: 4,   formatter: 'datetime', skeleton: 'yMMMdjm', condition_is_not_empty: }

        # Shared with BLAST, Family, FASTA, Accession

        # Shared with BLAST, Family, FASTA, Accession
        _est_generate_properties:
            - { property: 'allByAllEvalue', label: 'E-Value for SSN Edge Calculation',                                  order: 8,                           condition_is_not_empty: }
            - { property: 'numImportedIds', label: 'Total Number of Sequences in Dataset',                              order: 75,  formatter: 'integer' }
            - { property: 'numComputedIds', label: 'Number of Unique Sequences',                                        order: 76,  formatter: 'integer' }
            - { property: 'numBlastEdges', label: 'Total Number of Edges',                                              order: 77,  formatter: 'integer' }
            - { property: 'outputConvergenceRatio', label: 'Convergence Ratio',                                         order: 90,  formatter: 'number', is_html: true, help: '<a class="question" data-controller="tooltip" data-bs-toggle="tooltip" data-bs-custom-class="sequence-tooltip" title="The convergence ratio is a measure of the similarity of the sequences used in the BLAST.  It is the ratio of the total number of edges retained from the BLAST (e-values less than the specified threshold; default 5) to the total number of sequence pairs.  The value decreases from 1.0 for sequences that are very similar (identical) to 0.0 for sequences that are very different (unrelated).">?</a>', condition_is_not_empty: }

        _exclude_fragments_properties:
            - { property: 'excludeFragments', label: 'Exclude Fragments',                                               order: 50,  formatter: 'boolean_on_off',    condition_is_true: }
            - { property: 'numFragmentFiltered', label: 'Num Fragments Filtered',                                       order: 51,  formatter: 'integer',   condition_all: [ { property: 'excludeFragments', is_true: true } ] }

        _taxonomy_filter_properties:
            - { property: 'formattedTaxSearch', label: 'Taxononomy Categories',                                         order: 51,                          condition_is_not_empty: }

        _est_blast_properties:
            - { property: 'numBlastRetrievedIds', label: 'Actual Number of Retrieved Sequences',                        order: 14,  formatter: 'integer',   condition_is_not_empty: }
            - { property: 'numBlastUnmatchedIds', label: 'Number of Mismatched IDs',                                    order: 61,  formatter: 'integer',   condition_is_not_empty: }

        # Shared with BLAST, Family, FASTA, Accession
        _est_families_properties:
            #TODO: Change to "Added" for Accession, BLAST, FASTA
            - { property: 'fraction', label: 'Fraction Option',                                                         order: 52,  formatter: 'integer',   condition_all: [ { property: 'fraction', is_not_null: true }, { property: 'fraction', is_greater_than: 1 }, { property: 'useUniref', is_false: true } ] }
            - { property: 'formattedFamilies', label: 'Pfam / InterPro Family',                                         order: 20,                          condition_is_not_empty: }
            - { property: 'numFamilyIds', label: 'Number of IDs in Pfam / InterPro Family',                             order: 82,  formatter: 'integer',   condition_all: [ { property: 'useUniref', is_false: true } ] }
            # This is a virtual property that is aliased to numFamilyIds (we need it here to define the properties; if we duplicate numFamilyIds it overwrites the previous line)
            - { property: 'numFamilyIdsUniref', label: 'Number of UniRef Clusters in Pfam / InterPro Family',           order: 82,  formatter: 'integer',   condition_all: [ { property: 'useUniref', is_true: true }, { property: 'formattedFamilies', is_not_empty: true } ] }
            - { property: 'numFullFamilyIds', label: 'Number of IDs in Full Pfam / InterPro Family',                    order: 83,  formatter: 'integer',   condition_all: [ { property: 'useUniref', is_true: true }, { property: 'formattedFamilies', is_not_empty: true } ] }
            - { property: 'numFamilyOverlapIds', label: 'Number of Input Sequences Matched in Family',                  order: 83,  formatter: 'integer',   condition_all: [ { property: 'useUniref', is_true: true }, { property: 'formattedFamilies', is_not_empty: true } ] }
            - { property: 'numFractionFiltered', label: 'Number of IDs Removed by Fraction',                            order: 90,  formatter: 'integer',   condition_all: [ { property: 'fraction', is_not_null: true }, { property: 'fraction', is_greater_than: 1 } ] }
        _email_est_families_properties:
            - { property: 'formattedFamilies', label: 'Pfam / InterPro Family',                                         order: 20,                          condition_is_not_empty: }

        # Shared with BLAST, Family
        _est_family_domain_properties:
            - { property: 'formattedDomain', label: 'Domain Option',                                                    order: 15,                          condition_all: [ { property: 'domain', is_true: true } ] }

        # Shared with Accession and FASTA
        _est_user_sequences_properties:
            - { property: 'numMatchedIds', label: 'Number of IDs in Uploaded File with UniProt Mapping:',               order: 85,  formatter: 'integer',   condition_is_not_empty: }
            - { property: 'numUnmatchedIds', label: 'Number of IDs in Uploaded File without UniProt Mapping:',          order: 86,  formatter: 'integer',   condition_is_not_empty: }

        _uploaded_file_properties:
            - { property: 'formattedUploadedFilename', label: 'Uploaded File',                                          order: 10,                          condition_is_not_empty: }

        _est_fasta_properties:
            - { property: 'numFastaHeaders', label: 'Number of FASTA Headers in Uploaded File:',                        order: 87,  formatter: 'integer',   condition_is_not_empty: }

        _est_accession_properties:
            - { property: 'numForeignIds', label: 'Number of non-UniProt IDs in Uploaded File with UniProt Mapping:',   order: 87,  formatter: 'integer',   condition_is_not_empty: }

        _color_ssn_properties:
            - { property: 'numSsnClusters', label: 'Number of SSN Clusters',                                            order: 75,  formatter: 'integer',   condition_is_not_empty: }
            - { property: 'numSsnSingletons', label: 'Number of SSN Singletons',                                        order: 76,  formatter: 'integer',   condition_is_not_empty: }
            - { property: 'numSsnMetanodes', label: 'Number of SSN (Meta)nodes',                                        order: 77,  formatter: 'integer',   condition_is_not_empty: }
            - { property: 'numSsnAccessionIds', label: 'Number of IDs in SSN',                                          order: 78,  formatter: 'integer',   condition_is_not_empty: }
            - { property: 'colorSsnSequenceSource', label: 'SSN Sequence Source',                                       order: 79,                          condition_is_not_empty: }

        _cgfp_results_properties:
            - { property: 'numCdhitClusters', label: 'Number of CD-HIT ShortBRED families',                             order: 85,  formatter: 'integer',   condition_is_not_empty: }
            - { property: 'numMarkers', label: 'Number of markers',                                                     order: 86,  formatter: 'integer',   condition_is_not_empty: }
            - { property: 'numUniqueSeq', label: 'Number of unique sequences in SSN',                                   order: 87,  formatter: 'integer',   condition_is_not_empty: }


        est_blast_live_summary:
            _extends:
                - '_job_core_properties'
                - '_job_live_only_properties'
                - '_est_generate_properties'
                - '_est_families_properties'
                - '_est_blast_properties'
                - '_taxonomy_filter_properties'
                - '_exclude_fragments_properties'
            fields:
                - { property: 'blastEvalue', label: 'E-Value for UniProt BLAST Retrieval',                              order: 10,                          condition_is_not_empty: }
                - { property: 'blastMaxSequences', label: 'Maximum Number of Retrieved Sequences',                      order: 13,                          condition_is_not_empty: }
                - { property: 'formattedUnirefVersion', label: 'UniRef Version',                                        order: 25,                          condition_all: [ { property: 'useUniref', is_true: true }, { property: 'useFamilies', is_true: true } ] }
                - { property: 'blastQueryLink', label: 'Sequence Submitted for BLAST',                                  order: 11,  formatter: 'blast_query_link', formatter_options: { route_name: 'efi_est_blast_sequence' }, is_html: true }
                - { property: 'blastDatabase', label: 'BLAST Database',                                                 order: 12,                          condition_is_not_empty: }
        est_blast_email_submitted_summary:
            _extends:
                - '_job_core_properties'
                - '_email_job_submitted_properties'
                - '_email_est_families_properties'
            fields:
                - { property: 'blastQuery', label: 'Sequence Submitted for BLAST',                                      order: 11,  formatter: 'blast_query' }
                - { property: 'blastDatabase', label: 'BLAST Database',                                                 order: 12,                          condition_is_not_empty: }
        est_blast_email_started_summary:
            _extends:
                - '_job_core_properties'
                - '_email_job_started_properties'
                - '_email_est_families_properties'
        est_blast_email_finished_summary:
            _extends:
                - '_job_core_properties'
                - '_email_job_finished_properties'
                - '_email_est_families_properties'
            fields:
                - { property: 'resultsLink', label: 'resultsLink',                                                      order: 5,   formatter: 'job_results_link', formatter_options: { route_name: 'efi_est_dataset_results' }, is_html: true }
                - { property: 'blastQuery', label: 'Sequence Submitted for BLAST',                                      order: 11,  formatter: 'blast_query' }
                - { property: 'blastDatabase', label: 'BLAST Database',                                                 order: 12,                          condition_is_not_empty: }
        est_blast_email_failed_summary:
            _extends:
                - '_job_core_properties'
                - '_email_job_failed_properties'
                - '_email_est_families_properties'


        est_accession_live_summary:
            _extends:
                - '_job_core_properties'
                - '_job_live_only_properties'
                - '_est_generate_properties'
                - '_est_families_properties'
                - '_est_user_sequences_properties'
                - '_est_accession_properties'
                - '_taxonomy_filter_properties'
                - '_exclude_fragments_properties'
            fields:
                - { property: 'formattedDomainFamily', label: 'Domain Option',                                          order: 54,                          condition_all: [ { property: 'useFamilies', is_false: true } ] }
                - { property: 'formattedUnirefVersion', label: 'UniRef Version',                                        order: 25,                          condition_all: [ { property: 'useUniref', is_true: true }, { property: 'useFamilies', is_true: true } ] }
                - { property: 'formattedUnirefVersionWithFamilies', label: 'Input Sequence Source',                     order: 26,                          condition_all: [ { property: 'useUniref', is_true: true }, { property: 'useFamilies', is_false: true } ] }
        est_accession_email_submitted_summary:
            _extends:
                - '_job_core_properties'
                - '_email_job_submitted_properties'
                - '_email_est_families_properties'
                - '_uploaded_file_properties'
        est_accession_email_started_summary:
